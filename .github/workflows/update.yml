name: update
on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python main.py
        env:
          SHODAN_KEY: ${{ secrets.SHODAN_KEY }}
          FOFA_EMAIL: ${{ secrets.FOFA_EMAIL }}
          FOFA_KEY: ${{ secrets.FOFA_KEY }}
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add results
          git diff --cached --quiet || (git commit -m "update $(date -u +%F\ %H:%M)" && git push)
